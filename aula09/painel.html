<h2>Cadastro</h2>
<pre id="welcomeUser"></pre>
<h2>Usuarios cadastrados: </h2>


<p>Preencha o formulário abaixo:</p>

<body>

<form id="formRegister" class="column flex ">
    Nome:<input 
    id="cName"
    type="text" 
    placeholder="Nome completo"/><br>

    Email:<input 
    id="cMail"
    type="email" 
    placeholder="@gmail.com"/><br>

    Senha:<input
    id="cPass" 
    type="password" 
    placeholder="senhA1@"/><br>
    
    Data de Nascimento:<input 
    id="cDate"
    type="date"/><br>
    <a class="mt-5 bg-primary text-bluecian text-center rounded-md py-2">Salvar</a>

</form>
<pre id="listaUsers"></pre>
</body>
<script src="user.js">
    
</script>

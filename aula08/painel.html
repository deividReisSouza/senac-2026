<h2>Cadastro</h2>
<pre id="welcomeUser"></pre>
<h2>Usuarios cadastrados: </h2>
<pre id="listaUsers"></pre>

<p>Preencha o formulário abaixo:</p>
<form id="formRegister">
    Nome:<input 
    id="cName"
    type="text" 
    placeholder="Nome completo"/><br>

    Email:<input 
    id="cMail"
    type="email" 
    placeholder="@gmail.com"/><br>

    Senha:<input
    id="cPass" 
    type="password" 
    placeholder="senhA1@"/><br>
    
    Data de Nascimento:<input 
    id="cDate"
    type="date"/><br>
    <button type="submit">Salvar</button>
</form>

<script src="user.js">
    
</script>
